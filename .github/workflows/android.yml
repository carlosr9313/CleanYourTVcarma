name: Build CleanYourTV Cafe Preview
on:
  push:
    branches: [jedi-v2-ui]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build test APK
        run: cd launcher && chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon --max-workers=2 -PlauncherApplicationId=com.gathin.tvhome.cafe.preview
      - uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-Cafe-Preview
          path: launcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
