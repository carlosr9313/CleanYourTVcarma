name: Build CleanYourTV APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK
        run: echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
      - run: SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit); if [ -z "$SDKMANAGER" ]; then echo "ERROR: sdkmanager no está instalado"; exit 1; fi; yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0" || [ "${PIPESTATUS[1]}" -eq 0 ]
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-debug-apk
          path: app/build/outputs/apk/debug/*.apk
