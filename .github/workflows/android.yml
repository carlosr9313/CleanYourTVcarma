name: Build CleanYourTV Jedi Edition APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: cd launcher && chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon --max-workers=2 -PlauncherApplicationId=com.gathin.tvhome.jedi
      - uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-Jedi-Edition-apk
          path: launcher/app/build/outputs/apk/debug/*.apk
